<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git 版本控制示例</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <span class="version">版本 v1.0</span>
    <h1>我的 Git 学习项目</h1>
    <p>每次功能稳定后，就可以用 Git 保存一个版本。</p>
    <div class="counter">
      <button id="minus" aria-label="减少">−</button>
      <strong id="count">0</strong>
      <button id="plus" aria-label="增加">＋</button>
    </div>
    <button id="theme" class="theme">切换页面主题</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
